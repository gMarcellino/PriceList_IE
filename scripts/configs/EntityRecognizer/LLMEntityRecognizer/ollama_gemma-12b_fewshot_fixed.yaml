provider: "ollama"
model: "gemma3:12b"
api_key: null
base_url: null
azure_endpoint: null
azure_api_version: "2024-02-01"

inference_data_path: "data/test.json"
text_field: "text"
inference_output_path: "predictions/LLMEntityRecognizer/raw"
language: "IT"
#checkpoint_path: "checkpoints/LLMEntityRecognizer/ollama_entity_recognition_gemma-3-12b-it-fewshot-fixed.jsonl"

prompts_path: "src/entityRecognizer/prompts_IT.json"
system_prompt_key: "base"
user_prompt_key: "base"
system_as_user: false

temperature: 0.2
max_new_tokens: 2048
device: null
raw: false

few_shot:
  k: 4
  strategy: "fixed"
  examples_path: "data/training.json"
  text_field: "text"
  # Set explicit record IDs for a hand-picked fixed set. When null, the
  # training pool is shuffled once with seed and the first k examples are used.
  fixed_example_ids: null
  seed: 42
  exclude_same_text: true
